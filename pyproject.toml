[project]
name = "moltbook-tools"
version = "0.1.0"
description = "Tools for Moltbook Wiki - daily summaries and data processing"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.45.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.scripts]
moltbook-summary = "scripts.generate_summary:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
