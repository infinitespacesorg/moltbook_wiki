[build]
  base = "web"
  command = "cd .. && rm -rf moltbook_data && git clone --depth 1 https://github.com/ExtraE113/moltbook_data.git moltbook_data && ls -la moltbook_data/data/ && cd web && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"