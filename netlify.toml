[build]
  base = "web"
  command = "cd .. && git submodule update --init --recursive && echo 'Submodule contents:' && ls -la moltbook_data/ && ls -la moltbook_data/data/ && cd web && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"